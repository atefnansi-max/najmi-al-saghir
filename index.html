<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نجمي الصغير</title>
  <meta name="description" content="نجوم وتشجيع لأطفال الروضة: صورة الطفل بطل جوّا مشهد ملوّن، بتنبعت لأهله بكبسة.">
  <meta name="theme-color" content="#6C5CE7">
